# Render Blueprint: one web service (API + web app) and a PostgreSQL database.
# Deploy: https://dashboard.render.com/blueprint/new?repo=https://github.com/Matanelevavi/Planit
databases:
  - name: planit-db
    databaseName: planit
    user: planit
    plan: free # free databases expire after 30 days; choose a paid plan for real users

services:
  - type: web
    name: planit
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PLANIT_ENV
        value: prod
      - key: PLANIT_COOKIE_SECURE
        value: "true"
      - key: PLANIT_SECRET_KEY
        generateValue: true
      - key: PLANIT_DATABASE_URL
        fromDatabase:
          name: planit-db
          property: connectionString
