name: Keep awake

# Render's free plan puts a service to sleep after ~15 minutes without traffic.
# This pings the health endpoint every 5 minutes so first visitors don't wait ~1 minute.
# GitHub may delay scheduled runs under load, so this reduces sleeping rather than guaranteeing none.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl --fail --silent --show-error --max-time 90 --retry 2 https://planit-3srs.onrender.com/api/health
